<main class="page"><a routerLink="/" class="back">← System overview</a>
  @if (system(); as referenceSystem) { <app-operation-workbench [system]="referenceSystem" /> }
  @else if (error()) { <div role="alert" class="state">{{ error() }} <button type="button" (click)="load()">Retry</button></div> }
  @else { <div class="state">Loading subsystem catalog…</div> }
</main>
